# Copy to user_data/settings.yaml (the app does this on first save). Never put secrets here:
# the API key goes in a local .env file (ANTHROPIC_API_KEY=...).
shared_folder: ""          # synced Drive/OneDrive folder, optional
reports_dir: reports       # where reports are written
flag_pct: 10.0             # flag a line when |variance %| >= this ...
flag_min_cents: 15000      # ... AND |variance| >= this (15000 = $150.00)
early_warning_pct: 80      # used from v2
explain_mode: paste        # template | paste | api
redact: false              # hide transaction descriptions/vendors from facts
period:                    # asked every run, never auto-detected
  label: ""
  start: ""                # YYYY-MM-DD
  end: ""
last_period:               # prefilled next run
  label: ""
  start: ""
  end: ""
pct_elapsed: ""            # 0-100 to override the auto "% of period elapsed"
api_model: claude-sonnet-5-5
runner_email: ""           # gets questions for lines with no owner
owner_emails: {}           # "Owner Name": "name@example.org"
ocr_confidence: 0.8        # receipt values below this don't count until a person confirms
gmail:                     # token + credentials live in ~/.ace-variance, never in the shared folder
  labels: []               # the ONLY labels the app may read
  credentials_path: ""
  token_path: ""
  allow_list: []           # addresses a human-clicked send may reach
  reimbursement_label: ""
  export_label: ""
  question_label: ""
